<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SecureByPay - Technical Test Frontend">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Myafrimall | SecureByPay</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 400;
      src: url('assets/fonts/DMSans-Regular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 500;
      src: url('assets/fonts/DMSans-Medium.ttf') format('truetype');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 600;
      src: url('assets/fonts/DMSans-SemiBold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 700;
      src: url('assets/fonts/DMSans-Bold.ttf') format('truetype');
    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 800;
      src: url('assets/fonts/DMSans-ExtraBold.ttf') format('truetype');
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FC;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #5A65AB;
      font-family: inherit;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E2E8F0;
      border-top: 4px solid #5A65AB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div style="font-weight: 600; font-size: 16px;">Loading Myafrimall...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
